name: A2A maintenance verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Preserve native tmux for offline verification
        run: |
          mkdir -p "$RUNNER_TEMP/a2a-native-tmux/lib"
          cp /usr/bin/tmux "$RUNNER_TEMP/a2a-native-tmux/"
          ldd /usr/bin/tmux | awk '/lib(tinfo|event_core|utempter)/ { print $3 }' | while read -r lib; do
            cp -L "$lib" "$RUNNER_TEMP/a2a-native-tmux/lib/"
          done
          tar -czf "$RUNNER_TEMP/a2a-native-tmux.tar.gz" -C "$RUNNER_TEMP/a2a-native-tmux" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2a-native-tmux
          path: ${{ runner.temp }}/a2a-native-tmux.tar.gz
          retention-days: 1
      - name: Native Vitest
        run: npm test -- --reporter=verbose
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [cmd/a2a-dashboard, cmd/a2a-input-probe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: Go race tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python and shell syntax
        run: |
          python3 -m py_compile cmd/a2a-iterm2-bridge/bridge.py
          for file in cmd/a2a-iterm2-bridge/launch.sh install scripts/a2a-status-segment.sh completions/a2a.bash; do
            bash -n "$file"
          done
